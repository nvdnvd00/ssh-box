# Every push to main is a release: build Windows + macOS, then publish one GitHub Release whose latest.json feeds the Tauri updater.
# Needs secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Queue releases instead of racing: an older run finishing last would become the "latest" release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # A manual run from another branch must not publish a release.
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            files: src-tauri/target/release/bundle/nsis/*-setup.exe*
          - os: macos-latest
            # Universal = one .app for Apple Silicon and Intel. Ad-hoc signed via tauri.macos.conf.json, not notarized.
            args: --target universal-apple-darwin --bundles app,dmg
            files: |
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    outputs:
      # Both legs compute the same value, so whichever finishes last is fine.
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - name: Build
        id: build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Version = package.json major.minor + run number as the last part (0.2.5), the same everywhere.
          # run_number restarts at 1 if this file is renamed: bump the minor in package.json when that happens.
          VERSION="$(node -p 'require("./package.json").version.split(".").slice(0, 2).join(".")').${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Config goes through a file: Git Bash on Windows can rewrite path-like parts of a JSON argument.
          node -e 'require("fs").writeFileSync("release.conf.json", JSON.stringify({version: process.argv[1], bundle: {createUpdaterArtifacts: true}, plugins: {updater: {endpoints: [process.argv[2]]}}}))' "$VERSION" "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
          npx tauri build --verbose ${{ matrix.args }} --config release.conf.json
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Runs only when every build succeeded, so latest.json never lists a platform without its file.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
      - name: Create the GitHub Release
        run: |
          TAG="v$VERSION"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          # Plain asset names: GitHub turns the spaces in "SSH Box_..." into dots.
          mv Windows/*-setup.exe ssh-box-setup.exe
          mv macOS/macos/*.app.tar.gz ssh-box.app.tar.gz
          mv macOS/dmg/*.dmg ssh-box.dmg
          # The universal .app serves both Mac platform keys.
          node -e 'const fs=require("fs");const [version,url,winSig,macSig]=process.argv.slice(1);const mac={signature:fs.readFileSync(macSig,"utf8"),url:url+"/ssh-box.app.tar.gz"};fs.writeFileSync("latest.json",JSON.stringify({version,pub_date:new Date().toISOString(),platforms:{"windows-x86_64":{signature:fs.readFileSync(winSig,"utf8"),url:url+"/ssh-box-setup.exe"},"darwin-aarch64":mac,"darwin-x86_64":mac}},null,2))' "$VERSION" "$URL" Windows/*-setup.exe.sig macOS/macos/*.app.tar.gz.sig
          # gh uploads the assets to a draft and publishes it only once all of them are there.
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$VERSION" --latest --generate-notes ssh-box-setup.exe ssh-box.app.tar.gz ssh-box.dmg latest.json
          cat latest.json
