stages:
  - build

variables:
  CARGO_TERM_COLOR: "always"
  XWIN_ACCEPT_LICENSE: "1"
  XWIN_CROSS_COMPILER: "clang"
  AWS_REGION: "ap-southeast-1"
  S3_BUCKET: "your-s3-bucket"

build-windows-installer:
  stage: build
  image: rust:1-bookworm
  tags:
    - runner-x86
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  cache:
    key: ssh-box-win64-cache
    paths:
      - .xwin-cache/
      - .npm/
  script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates xz-utils llvm clang lld nsis pkg-config libssl-dev
    - mkdir -p /usr/share/nsis/Include/Win && curl -fsSL https://raw.githubusercontent.com/kichik/nsis/master/Include/Win/RestartManager.nsh -o /usr/share/nsis/Include/Win/RestartManager.nsh
    - curl -fsSL https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz | tar -xJ -C /usr/local --strip-components=1
    - node -v && npm -v
    - curl -fsSL https://github.com/rust-cross/cargo-xwin/releases/download/v0.23.1/cargo-xwin-v0.23.1.x86_64-unknown-linux-musl.tar.gz | tar -xz -C /usr/local/bin
    - cargo-xwin --version
    - rustup target add x86_64-pc-windows-msvc
    - cargo-xwin xwin cache windows-msvc-sysroot --cache-dir "$CI_PROJECT_DIR/.xwin-cache"
    - npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline
    # Release version comes directly from package.json; update endpoint is injected here.
    # Needs CI variables: TAURI_SIGNING_PRIVATE_KEY, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (IAM user gitlab-ssh-box-release: PutObject on ssh-box/* only).
    - VERSION="$(node -p 'require("./package.json").version')"
    - UPDATE_URL="https://${S3_BUCKET}.s3.${AWS_REGION}.amazonaws.com/ssh-box"
    - export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
    - XWIN_CROSS_COMPILER=clang XWIN_CACHE_DIR="$CI_PROJECT_DIR/.xwin-cache" npx tauri build --verbose --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis --config "{\"version\":\"$VERSION\",\"bundle\":{\"createUpdaterArtifacts\":true},\"plugins\":{\"updater\":{\"endpoints\":[\"$UPDATE_URL/latest.json\"]}}}"
    - mkdir -p artifacts/windows
    - cp -v src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe artifacts/windows/
    - ls -lh artifacts/windows/
    - |
      SETUP_EXE="$(ls src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)"
      node -e 'const fs=require("fs");const [version,url,sig]=process.argv.slice(1);fs.writeFileSync("latest.json",JSON.stringify({version,pub_date:new Date().toISOString(),platforms:{"windows-x86_64":{signature:fs.readFileSync(sig,"utf8"),url}}},null,2))' "$VERSION" "$UPDATE_URL/$VERSION/ssh-box-setup.exe" "$SETUP_EXE.sig"
      s3_put() { curl -fsS --aws-sigv4 "aws:amz:${AWS_REGION}:s3" --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" -H "x-amz-content-sha256: UNSIGNED-PAYLOAD" -T "$1" "$2"; }
      s3_put "$SETUP_EXE" "$UPDATE_URL/$VERSION/ssh-box-setup.exe"
      s3_put latest.json "$UPDATE_URL/latest.json"
      cat latest.json
  artifacts:
    name: "ssh-box-windows-installer-$CI_COMMIT_SHORT_SHA"
    paths:
      - artifacts/windows/
